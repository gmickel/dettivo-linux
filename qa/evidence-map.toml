# The evidence map (NFR-10): every R-ID of every spec under .flow/specs/ has
# at least one route that proves it, and `dettivo-qa evidence-map` checks
# that every route's ref resolves against the repository (docs/guides/qa.md
# names the kinds and what each ref is). One route may serve several R-IDs;
# an R-ID may have several routes. A `human` route is a receipt only a
# person can produce and is listed separately in the report.

