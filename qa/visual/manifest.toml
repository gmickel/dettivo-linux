# The visual regression manifest (ADR 0021, docs/qa.md). `dettivo-qa visual`
# renders every surface below at every scale and theme, diffs each render
# against its baseline with dettivo-visual-diff and blocks on an unapproved
# difference. A surface with an artboard has its Black Gold crops cut from
# it by scripts/design/crop-baseline.py (`crop = "boxes"` finds the bordered
# boxes top to bottom in state order; no crop rule means the artboard itself
# is the crop; a state whose region the window draws elsewhere names the
# render's rectangle in `render_crop`); every other theme and scale is
# approved once through `dettivo-qa visual approve` and recorded in
# docs/design/baselines.md.

# Fixture names under qt/fixtures/themes/, plus the two built-in palettes
# the product shows off Omarchy (the portal colour scheme pinned).
themes = ["black-gold", "catppuccin-latte", "tokyo-night", "builtin-dark", "builtin-light"]
scales = [1, 2]

# The design system sheet: palette, type, spacing, controls, icons, motion.
[[surface]]
name = "design-system"
binary = "dettivo-sheet"
artboard = "design-system.png"
threshold = 0.55

[[surface.state]]
name = "sheet"

# The recording pill, one state per render (docs/osd.md).
[[surface]]
name = "osd"
binary = "dettivo-osd"
artboard = "osd.png"
crop = "boxes"
threshold = 0.55

[[surface.state]]
name = "listening"
env = { DETTIVO_E2E_OSD_STATE = "listening" }

[[surface.state]]
name = "transcribing"
env = { DETTIVO_E2E_OSD_STATE = "transcribing" }

[[surface.state]]
name = "enhancing"
env = { DETTIVO_E2E_OSD_STATE = "enhancing" }

[[surface.state]]
name = "inserted"
env = { DETTIVO_E2E_OSD_STATE = "inserted" }

[[surface.state]]
name = "copied"
env = { DETTIVO_E2E_OSD_STATE = "copied" }

[[surface.state]]
name = "error"
env = { DETTIVO_E2E_OSD_STATE = "error" }

# The Omarchy panel (docs/omarchy.md), rendered by dettivo-bar without the
# shell: the 340 px card from omarchy-bar-panel.png. The artboard shows the
# meeting state, so every state's crop is that panel box: idle, recording
# and transcribing share its structure and are gated by it on Black Gold,
# the hint state takes an approved render.
[[surface]]
name = "panel"
binary = "dettivo-bar"
artboard = "omarchy-bar-panel.png"
threshold = 0.55
# dettivo-bar draws the panel alone, so the render is compared whole and
# each state's rectangle cuts the artboard only.
crop_render = false

[[surface.state]]
name = "meeting"
env = { DETTIVO_E2E_BAR_STATE = "panel-meeting" }
crop = [842, 34, 342, 398]

[[surface.state]]
name = "idle"
env = { DETTIVO_E2E_BAR_STATE = "panel-idle" }
crop = [842, 34, 342, 398]

[[surface.state]]
name = "recording"
env = { DETTIVO_E2E_BAR_STATE = "panel-recording" }
crop = [842, 34, 342, 398]

[[surface.state]]
name = "transcribing"
env = { DETTIVO_E2E_BAR_STATE = "panel-transcribing" }
crop = [842, 34, 342, 398]

[[surface.state]]
name = "hint"
env = { DETTIVO_E2E_BAR_STATE = "panel-hint" }
crop = [842, 34, 342, 398]

# The bar glyph: the five cells of the strip at the foot of osd.png, each
# the 16 px mark with the state's name.
[[surface]]
name = "bar-glyph"
binary = "dettivo-bar"
artboard = "osd.png"
threshold = 0.55
crop_render = false

[[surface.state]]
name = "idle"
env = { DETTIVO_E2E_BAR_STATE = "glyph-idle" }
crop = [56, 1103, 76, 44]

[[surface.state]]
name = "listening"
env = { DETTIVO_E2E_BAR_STATE = "glyph-listening" }
crop = [159, 1103, 106, 44]

[[surface.state]]
name = "transcribing"
