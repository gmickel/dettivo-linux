crop = [298, 1103, 130, 44]

[[surface.state]]
name = "meeting"
env = { DETTIVO_E2E_BAR_STATE = "glyph-meeting" }
crop = [460, 1103, 136, 44]

[[surface.state]]
name = "error"
env = { DETTIVO_E2E_BAR_STATE = "glyph-error" }
crop = [627, 1103, 78, 44]

# The QA insert target: one text field, no artboard, so every baseline is
# an approved render.
[[surface]]
