# Black Gold, the reference theme the Studio artboards were approved in
# (docs/design/README.md). colors.toml and shell.toml are the HANCORE
# theme's files (LICENSE beside them, MIT) with one change: `accent` is
# the gold the artboards, the built-in palette and the shell's focus,
# pressed and bar-active tokens all name (#F5BF03); the theme file itself
# names a muted stone (#6E6A58) that the design never uses.
accent = "#F5BF03"
cursor = "#a3850e"
foreground = "#ebdbb2"
background = "#0D0D0D"
selection_foreground = "#0D0D0D"
selection_background = "#ebdbb2"

